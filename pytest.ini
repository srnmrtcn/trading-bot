[pytest]
pythonpath = .
# Third-party deprecation noise from the installed python-binance/urllib3 stack
# (not raised by this project's code) — silenced to keep the suite output clean.
filterwarnings =
    ignore:websockets\.WebSocketClientProtocol is deprecated:DeprecationWarning
    ignore:websockets\.legacy is deprecated:DeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL
